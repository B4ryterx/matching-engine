# Post-code lifecycle for the matching engine.
# Every change: build -> unit tests -> byte-for-byte check against an independent reference -> speed gate
# -> security scans -> container image -> (default branch) deploy -> scheduled production probe.
# Duo Agent Platform flows (see .gitlab/duo/) react to issues, merge requests and failed pipelines.

stages: [build, test, verify, secure, package, deploy, monitor]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  image: python:3.12-bookworm   # includes g++ and make

.not_schedule: &not_schedule
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success

build:
  stage: build
  rules: *not_schedule
  script:
    - make all CXX=g++
  artifacts:
    paths: [build/]
    expire_in: 1 week

unit-tests:
  stage: test
  rules: *not_schedule
  needs: [build]
  script:
    - build/test_matching

byte-for-byte:
  stage: verify
  rules: *not_schedule
  needs: [build]
  script:
    # three independent random order flows; every one must match the reference exchange exactly
    - for s in 1 2 3; do python3 ci/verify_run.py 200000 $s | tee run_$s.json; done
    - python3 -c "import json,statistics as st; r=[json.load(open(f'run_{s}.json')) for s in (1,2,3)]; m={'identical':all(x['identical'] for x in r),'mean_ns':st.median(x['mean_ns'] for x in r),'p99_ns':st.median(x['p99_ns'] for x in r)}; json.dump(m,open('verify.json','w')); print(m)"
    - python3 ci/perf_gate.py verify.json
  artifacts:
    when: always
    paths: [verify.json, perf_report.json, run_*.json]
    expire_in: 4 weeks

sast:
  stage: secure
  rules: *not_schedule

secret_detection:
  stage: secure
  rules: *not_schedule

container-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [byte-for-byte, unit-tests]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg APP_VERSION=$CI_COMMIT_SHORT_SHA -t $IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker push $IMAGE
    - docker push $CI_REGISTRY_IMAGE:latest

deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
  needs: [container-image]
  environment:
    name: production
    url: $LIVE_URL
  script:
    - echo "$GCP_SA_KEY" > key.json && gcloud auth activate-service-account --key-file key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - bash deploy/cloud_run.sh

production-probe:
  stage: monitor
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LIVE_URL
  script:
    - python3 ci/probe.py
