# Post-code lifecycle for the matching engine ("autopilot").
#
#   issue ──► Duo Autopilot flow writes the change and opens an MR titled "[autopilot] …"
#   MR    ──► build ─► unit tests ─► byte-for-byte vs independent reference ─► speed gate ─► SAST + secrets
#             ─► gate report posted on the MR ─► auto-merge when every gate is green
#   main  ──► container image ─► deploy ─► release (tag + changelog)
#   schedule ─► production probe ─► opens an "incident" issue on failure ─► back to the Autopilot flow
#
# Duo flows live in .gitlab/duo/; the agent's build environment is .gitlab/duo/agent-config.yml.

stages: [build, test, verify, secure, review, package, deploy, release, monitor]

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  AST_ENABLE_MR_PIPELINES: "true"
  SAST_EXCLUDED_PATHS: "data, build"

default:
  image: python:3.12-bookworm   # includes g++ and make

.code_change:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.mr_only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_API_TOKEN

.main_only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── build / test / verify ────────────────────────────────────────────────
build:
  stage: build
  extends: .code_change
  script:
    - make all CXX=g++
  artifacts:
    paths: [build/]
    expire_in: 1 week

unit-tests:
  stage: test
  extends: .code_change
  needs: [build]
  script:
    - build/test_matching

byte-for-byte:
  stage: verify
  extends: .code_change
  needs: [build]
  script:
    # three random order flows; candidate must match the reference exactly, and is timed
    # against the base version built on the same runner (A/B), so runner speed cancels out
    - python3 ci/ab_bench.py
    - python3 ci/perf_gate.py verify.json
  artifacts:
    when: always
    paths: [verify.json, perf_report.json]
    expire_in: 4 weeks

# ── secure ───────────────────────────────────────────────────────────────
# The SAST (semgrep) and secret-detection jobs come from GitLab's templates; with
# AST_ENABLE_MR_PIPELINES they also run in merge request pipelines, before anything merges.

# ── review: governance record + hands-off merge ──────────────────────────
gate-report:
  stage: review
  extends: .mr_only
  needs: [byte-for-byte]
  script:
    - python3 ci/gate_report.py

auto-merge:
  stage: review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_API_TOKEN && $CI_MERGE_REQUEST_TITLE =~ /^\[autopilot\]/
  needs: [unit-tests, byte-for-byte]
  script:
    # merges as soon as the whole pipeline (including security scans) has passed
    - >
      curl --fail -sS -X PUT -H "PRIVATE-TOKEN: $GITLAB_API_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/merge?auto_merge=true&merge_when_pipeline_succeeds=true&should_remove_source_branch=true"
      | python3 -c "import json,sys; d=json.load(sys.stdin); print('auto-merge set:', d.get('merge_when_pipeline_succeeds') or d.get('auto_merge_enabled'), d.get('web_url'))"

# ── package / deploy / release (default branch) ──────────────────────────
container-image:
  stage: package
  extends: .main_only
  image: docker:27
  services: [docker:27-dind]
  needs: [byte-for-byte, unit-tests]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg APP_VERSION=$CI_COMMIT_SHORT_SHA -t $IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker push $IMAGE
    - docker push $CI_REGISTRY_IMAGE:latest

deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
  needs: [container-image]
  environment:
    name: production
    url: $LIVE_URL
  script:
    - echo "$GCP_SA_KEY" > key.json && gcloud auth activate-service-account --key-file key.json
    - gcloud config set project "$GCP_PROJECT_ID"
    - bash deploy/cloud_run.sh

release:
  stage: release
  extends: .main_only
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [container-image]
  script:
    - echo "Release v1.$CI_PIPELINE_IID for $CI_COMMIT_SHORT_SHA"
  release:
    tag_name: v1.$CI_PIPELINE_IID
    ref: $CI_COMMIT_SHA
    name: "v1.$CI_PIPELINE_IID"
    description: |
      Automated release from pipeline $CI_PIPELINE_URL

      Commit: $CI_COMMIT_TITLE

      All gates passed: unit tests, byte-for-byte equality with the independent reference exchange
      (3 × 200,000 random orders), speed gate, SAST and secret detection.
      Container image: $IMAGE

# ── monitor ──────────────────────────────────────────────────────────────
production-probe:
  stage: monitor
  image: python:3.12-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $LIVE_URL
  script:
    - python3 ci/probe.py
